[PARSER]
    Name        roslaunch_console
    Format      regex
    Regex       ^(?:\x1b\[[0-9;]*m)*\[(?<severity>[A-Z]+)\]\s+\[(?<ros_time>[^\]]+)\]\s+\[(?<node>[^\]]*)\]\s+\[(?<logger>[^\]]*)\]:\s*(?<message>.*?)(?:\x1b\[[0-9;]*m)*$

[PARSER]
    Name        rosout
    Format      regex
    Regex       ^(?<ros_time>[0-9]+\.[0-9]+)\s+(?<severity>[A-Z]+)\s+(?<node>\S+)\s+\[(?<location>[^\]]+)\]\s+\[topics:\s*(?<topics>[^\]]*)\]\s+(?<message>.*)$
