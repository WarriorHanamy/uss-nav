[SERVICE]
    Flush        1
    Log_Level    info
    Parsers_File /fluent-bit/etc/fluent-bit-parsers.conf

[INPUT]
    Name              tail
    Path              /workspace/.artifacts/traces/${TRACE_ID}/roslaunch.log
    Tag               uss_nav.roslaunch
    Path_Key          log_path
    Read_From_Head    true
    Refresh_Interval  1
    Rotate_Wait       5
    Mem_Buf_Limit     20MB
    Skip_Long_Lines   On

[INPUT]
    Name              tail
    Path              /workspace/.artifacts/traces/${TRACE_ID}/ros/*.log,/workspace/.artifacts/traces/${TRACE_ID}/ros/*/*.log
    Tag               uss_nav.ros
    Path_Key          log_path
    Read_From_Head    true
    Refresh_Interval  1
    Rotate_Wait       5
    Mem_Buf_Limit     20MB
    Skip_Long_Lines   On

[FILTER]
    Name          record_modifier
    Match         uss_nav.*
    Record        trace_id ${TRACE_ID}
    Record        log_source roslog

[FILTER]
    Name          parser
    Match         uss_nav.*
    Key_Name      log
    Parser        roslaunch_console
    Parser        rosout
    Reserve_Data  On
    Preserve_Key  On

[FILTER]
    Name          lua
    Match         uss_nav.*
    Script        /fluent-bit/etc/fluent-bit-roslog-fields.lua
    Call          extract_roslog_fields

# Re-tag structured events (records with a module field) for the machine-readable
# opt_events stream. Match only input tags so re-emitted records do not loop.
[FILTER]
    Name          rewrite_tag
    Match         uss_nav.roslaunch
    Rule          $module .+ uss_nav.opt_event true

[FILTER]
    Name          rewrite_tag
    Match         uss_nav.ros
    Rule          $module .+ uss_nav.opt_event true

# Machine-readable structured event stream (all record fields, LTSV);
# consumed by tools/opt_cases/mine_cases.py.
[OUTPUT]
    Name   file
    Match  uss_nav.opt_event
    Path   /workspace/.artifacts/traces/${TRACE_ID}
    File   opt_events.ltsv
    Format ltsv

[OUTPUT]
    Name   stdout
    Match  uss_nav.*
    Format json_lines

[OUTPUT]
    Name   file
    Match  uss_nav.*
    Path   /workspace/.artifacts/traces/${TRACE_ID}
    File   fluentbit_roslog.log
    Format template
    Template {time} trace_id={trace_id} source={log_source} path={log_path} severity={severity} node={node} message={message}
