[SERVICE]
    Flush        1
    Log_Level    info
    Parsers_File parsers.conf

[INPUT]
    Name              tail
    Path              /workspace/.artifacts/traces/*/decision.jsonl
    Tag               uss_nav.decision
    Parser            json
    Refresh_Interval  1
    Rotate_Wait       5
    Mem_Buf_Limit     20MB
    Skip_Long_Lines   On

[OUTPUT]
    Name   stdout
    Match  uss_nav.decision

[OUTPUT]
    Name   file
    Match  uss_nav.decision
    Path   /workspace/.artifacts/traces
    File   fluentbit.out
