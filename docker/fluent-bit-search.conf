[SERVICE]
    Flush        1
    Log_Level    info
    Parsers_File /fluent-bit/etc/fluent-bit-parsers.conf

[INPUT]
    Name              tail
    Path              /workspace/.artifacts/traces/${TRACE_ID}/roslaunch.log
    Tag               uss_nav.roslaunch
    Path_Key          log_path
    Read_From_Head    true
    Refresh_Interval  1
    Rotate_Wait       5
    Mem_Buf_Limit     20MB
    Skip_Long_Lines   On

[INPUT]
    Name              tail
    Path              /workspace/.artifacts/traces/${TRACE_ID}/ros/*.log,/workspace/.artifacts/traces/${TRACE_ID}/ros/*/*.log
    Tag               uss_nav.ros
    Path_Key          log_path
    Read_From_Head    true
    Refresh_Interval  1
    Rotate_Wait       5
    Mem_Buf_Limit     20MB
    Skip_Long_Lines   On

[FILTER]
    Name          record_modifier
    Match         uss_nav.*
    Record        trace_id ${TRACE_ID}
    Record        log_source roslog

[FILTER]
    Name          parser
    Match         uss_nav.*
    Key_Name      log
    Parser        roslaunch_console
    Parser        rosout
    Reserve_Data  On
    Preserve_Key  On

[FILTER]
    Name          lua
    Match         uss_nav.*
    script        /fluent-bit/etc/fluent-bit-roslog-fields.lua
    call          extract_roslog_fields

[OUTPUT]
    Name   stdout
    Match  uss_nav.*
    Format json_lines

[OUTPUT]
    Name   file
    Match  uss_nav.*
    Path   /workspace/.artifacts/traces/${TRACE_ID}
    File   fluentbit_roslog.log
    Format template
    Template {time} trace_id={trace_id} source={log_source} path={log_path} severity={severity} node={node} module={module} event={event} message={message}

[OUTPUT]
    Name                opensearch
    Match               uss_nav.*
    Host                opensearch
    Port                9200
    Index               uss-nav-roslog-${TRACE_ID}
    Type                _doc
    Logstash_Format     Off
    Suppress_Type_Name  On
    Replace_Dots        On
    Retry_Limit         False
