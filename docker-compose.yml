# USS-NAV Docker Compose — devel / build / test / release lifecycle
# Container naming: uss-nav-{phase}-{GIT_SHA:-local}

services:
  devel:
    build:
      context: .
      dockerfile: docker/Dockerfile.devel
    image: ego-planner-sim
    container_name: uss-nav-devel-${GIT_SHA:-local}
    stdin_open: true
    tty: true
    network_mode: host
    ipc: host
    environment:
      - DISPLAY=${DISPLAY:-:99}
      - __GLX_VENDOR_LIBRARY_NAME=nvidia
      - TRACE_ENABLE=${TRACE_ENABLE:-0}
      - TRACE_ID=${TRACE_ID:-}
      - TRACE_BAG_PROFILE=${TRACE_BAG_PROFILE:-core}
      - TRACE_BAG_TOPICS=${TRACE_BAG_TOPICS:-}
      - LAUNCH_MODE=${LAUNCH_MODE:-scenegraph}
      - MAP_PCD=${MAP_PCD:-/workspace/.data/pcd/J30V2_latest.pcd}
    volumes:
      - type: bind
        source: ./ws_main/src
        target: /workspace/src
        read_only: true
      - type: bind
        source: ./bringup_test
        target: /workspace/src/bringup_test
        read_only: true
      - type: bind
        source: ./.artifacts/devel
        target: /workspace/devel
      - type: bind
        source: ./.artifacts/build
        target: /workspace/build
      - type: bind
        source: ./.artifacts
        target: /workspace/.artifacts
      - type: bind
        source: ./.data
        target: /workspace/.data
        read_only: true
      - /tmp/.X11-unix:/tmp/.X11-unix
    entrypoint: ["/entrypoint.sh"]

  build:
    image: ego-planner-sim
    container_name: uss-nav-build-${GIT_SHA:-local}
    network_mode: host
    ipc: host
    volumes:
      - type: bind
        source: ./ws_main/src
        target: /workspace/src
        read_only: true
      - type: bind
        source: ./bringup_test
        target: /workspace/src/bringup_test
        read_only: true
      - type: bind
        source: ./.artifacts/devel
        target: /workspace/devel
      - type: bind
        source: ./.artifacts/build
        target: /workspace/build
      - type: bind
        source: ./.artifacts
        target: /workspace/.artifacts
    entrypoint:
      ["bash", "-c", "source /opt/ros/noetic/setup.bash && catkin build --no-status --continue-on-failure -j4 --cmake-args -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS='-w' -DCMAKE_POLICY_DEFAULT_CMP0148=OLD -DCMAKE_POLICY_VERSION_MINIMUM=3.5"]

  test:
    image: ego-planner-sim
    container_name: uss-nav-test-${GIT_SHA:-local}
    network_mode: host
    ipc: host
    environment:
      - TEST_ID=${TEST_ID:-default}
      - MQTT_HOST=${MQTT_HOST:-host.docker.internal}
      - DURATION=${DURATION:-300}
      - FLIGHT_TYPE=${FLIGHT_TYPE:-2}
      - MAX_VEL=${MAX_VEL:-0.6}
      - MAX_ACC=${MAX_ACC:-1.0}
      - OBS_NUM=${OBS_NUM:-30}
      - X_SIZE=${X_SIZE:-50}
      - Y_SIZE=${Y_SIZE:-30}
      - TRACE_ENABLE=${TRACE_ENABLE:-0}
      - TRACE_ID=${TRACE_ID:-}
      - TRACE_BAG_PROFILE=${TRACE_BAG_PROFILE:-core}
      - TRACE_BAG_TOPICS=${TRACE_BAG_TOPICS:-}
    volumes:
      - type: bind
        source: ./ws_main/src
        target: /workspace/src
        read_only: true
      - type: bind
        source: ./bringup_test
        target: /workspace/src/bringup_test
        read_only: true
      - type: bind
        source: ./.artifacts/devel
        target: /workspace/devel
      - type: bind
        source: ./.artifacts/build
        target: /workspace/build
      - type: bind
        source: ./.artifacts
        target: /workspace/.artifacts
    entrypoint: ["/entrypoint-test.sh"]

  release:
    build:
      context: .
      dockerfile: docker/Dockerfile.release
    image: ego-planner-release
    container_name: uss-nav-release-${GIT_SHA:-local}
    stdin_open: true
    tty: true
    network_mode: host
    ipc: host
    environment:
      - DISPLAY=${DISPLAY:-:99}
      - __GLX_VENDOR_LIBRARY_NAME=nvidia
      - TRACE_ENABLE=${TRACE_ENABLE:-0}
      - TRACE_ID=${TRACE_ID:-}
      - TRACE_BAG_PROFILE=${TRACE_BAG_PROFILE:-core}
      - TRACE_BAG_TOPICS=${TRACE_BAG_TOPICS:-}
    volumes:
      - type: bind
        source: ./ws_main/src
        target: /workspace/src
        read_only: true
      - type: bind
        source: ./bringup_test
        target: /workspace/src/bringup_test
        read_only: true
      - type: bind
        source: ./.artifacts/devel
        target: /workspace/devel
      - type: bind
        source: ./.artifacts/build
        target: /workspace/build
      - type: bind
        source: ./.artifacts
        target: /workspace/.artifacts
      - type: bind
        source: ./.data
        target: /workspace/.data
        read_only: true
      - /tmp/.X11-unix:/tmp/.X11-unix
      - type: bind
        source: ./.pretrained
        target: /workspace/.pretrained
    entrypoint: ["/entrypoint-release.sh"]

  fluent-bit:
    image: fluent/fluent-bit:3.1
    container_name: uss-nav-fluent-bit-${GIT_SHA:-local}
    environment:
      - TRACE_ID=${TRACE_ID:-}
    volumes:
      - type: bind
        source: ./.artifacts
        target: /workspace/.artifacts
      - type: bind
        source: ./docker/fluent-bit.conf
        target: /fluent-bit/etc/fluent-bit.conf
        read_only: true
      - type: bind
        source: ./docker/fluent-bit-parsers.conf
        target: /fluent-bit/etc/fluent-bit-parsers.conf
        read_only: true
    command: ["/fluent-bit/bin/fluent-bit", "-c", "/fluent-bit/etc/fluent-bit.conf"]

  fluent-bit-search:
    image: fluent/fluent-bit:3.1
    container_name: uss-nav-fluent-bit-search-${GIT_SHA:-local}
    profiles: ["trace-search"]
    depends_on:
      - opensearch
    environment:
      - TRACE_ID=${TRACE_ID:-}
    volumes:
      - type: bind
        source: ./.artifacts
        target: /workspace/.artifacts
      - type: bind
        source: ./docker/fluent-bit-search.conf
        target: /fluent-bit/etc/fluent-bit-search.conf
        read_only: true
      - type: bind
        source: ./docker/fluent-bit-parsers.conf
        target: /fluent-bit/etc/fluent-bit-parsers.conf
        read_only: true
      - type: bind
        source: ./docker/fluent-bit-roslog-fields.lua
        target: /fluent-bit/etc/fluent-bit-roslog-fields.lua
        read_only: true
    command: ["/fluent-bit/bin/fluent-bit", "-c", "/fluent-bit/etc/fluent-bit-search.conf"]

  opensearch:
    image: opensearchproject/opensearch:2.15.0
    container_name: uss-nav-opensearch-${GIT_SHA:-local}
    profiles: ["trace-search"]
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - bootstrap.memory_lock=false
    ports:
      - "9200:9200"
    volumes:
      - type: volume
        source: opensearch-data
        target: /usr/share/opensearch/data

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.15.0
    container_name: uss-nav-opensearch-dashboards-${GIT_SHA:-local}
    profiles: ["trace-search"]
    depends_on:
      - opensearch
    environment:
      - OPENSEARCH_HOSTS=["http://opensearch:9200"]
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    ports:
      - "5601:5601"

volumes:
  opensearch-data:
