# USS-NAV Docker Compose — devel / build / test / release lifecycle
# Container naming: uss-nav-{phase}-{GIT_SHA:-local}

services:
  devel:
    build:
      context: .
      dockerfile: docker/Dockerfile.devel
    image: ego-planner-sim
    container_name: uss-nav-devel-${GIT_SHA:-local}
    stdin_open: true
    tty: true
    network_mode: host
    ipc: host
    environment:
      - DISPLAY=${DISPLAY:-:99}
      - __GLX_VENDOR_LIBRARY_NAME=nvidia
    volumes:
      - type: bind
        source: ./ws_main/src
        target: /workspace/src
        read_only: true
      - type: bind
        source: ./bringup_test
        target: /workspace/src/bringup_test
        read_only: true
      - type: bind
        source: ./.artifacts/devel
        target: /workspace/devel
      - type: bind
        source: ./.artifacts/build
        target: /workspace/build
      - type: bind
        source: ./.artifacts
        target: /workspace/.artifacts
      - type: bind
        source: ./.data
        target: /workspace/.data
        read_only: true
      - /tmp/.X11-unix:/tmp/.X11-unix
    entrypoint: ["/entrypoint.sh"]

  build:
    image: ego-planner-sim
    container_name: uss-nav-build-${GIT_SHA:-local}
    network_mode: host
    ipc: host
    volumes:
      - type: bind
        source: ./ws_main/src
        target: /workspace/src
        read_only: true
      - type: bind
        source: ./bringup_test
        target: /workspace/src/bringup_test
        read_only: true
      - type: bind
        source: ./.artifacts/devel
        target: /workspace/devel
      - type: bind
        source: ./.artifacts/build
        target: /workspace/build
      - type: bind
        source: ./.artifacts
        target: /workspace/.artifacts
    entrypoint:
      ["bash", "-c", "source /opt/ros/noetic/setup.bash && catkin build --no-status --continue-on-failure -j4 --cmake-args -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS='-w' -DCMAKE_POLICY_DEFAULT_CMP0148=OLD -DCMAKE_POLICY_VERSION_MINIMUM=3.5"]

  test:
    image: ego-planner-sim
    container_name: uss-nav-test-${GIT_SHA:-local}
    network_mode: host
    ipc: host
    environment:
      - TEST_ID=${TEST_ID:-default}
      - MQTT_HOST=${MQTT_HOST:-host.docker.internal}
      - DURATION=${DURATION:-300}
      - FLIGHT_TYPE=${FLIGHT_TYPE:-2}
      - MAX_VEL=${MAX_VEL:-0.6}
      - MAX_ACC=${MAX_ACC:-1.0}
      - OBS_NUM=${OBS_NUM:-30}
      - X_SIZE=${X_SIZE:-50}
      - Y_SIZE=${Y_SIZE:-30}
    volumes:
      - type: bind
        source: ./ws_main/src
        target: /workspace/src
        read_only: true
      - type: bind
        source: ./bringup_test
        target: /workspace/src/bringup_test
        read_only: true
      - type: bind
        source: ./.artifacts/devel
        target: /workspace/devel
      - type: bind
        source: ./.artifacts/build
        target: /workspace/build
      - type: bind
        source: ./.artifacts
        target: /workspace/.artifacts
    entrypoint: ["/entrypoint-test.sh"]

  release:
    build:
      context: .
      dockerfile: docker/Dockerfile.release
    image: ego-planner-release
    container_name: uss-nav-release-${GIT_SHA:-local}
    stdin_open: true
    tty: true
    network_mode: host
    ipc: host
    environment:
      - DISPLAY=${DISPLAY:-:99}
      - __GLX_VENDOR_LIBRARY_NAME=nvidia
    volumes:
      - type: bind
        source: ./ws_main/src
        target: /workspace/src
        read_only: true
      - type: bind
        source: ./bringup_test
        target: /workspace/src/bringup_test
        read_only: true
      - type: bind
        source: ./.artifacts/devel
        target: /workspace/devel
      - type: bind
        source: ./.artifacts/build
        target: /workspace/build
      - type: bind
        source: ./.artifacts
        target: /workspace/.artifacts
      - type: bind
        source: ./.data
        target: /workspace/.data
        read_only: true
      - /tmp/.X11-unix:/tmp/.X11-unix
      - type: bind
        source: ./.pretrained
        target: /workspace/.pretrained
    entrypoint: ["/entrypoint-release.sh"]
