# ============================================================================
# TOPOLOGICAL LAYERS
# ============================================================================
layers:
  - name: "L0: Messages & Foundation Libraries"
    description: "Message packages, header-only utilities, and base libraries with no internal dependencies"
    packages:
      - quadrotor_msgs       # Messages used by almost all packages
      - traj_utils           # Trajectory utility messages
      - object_detection_msgs # Bounding box detection messages
      - decomp_ros_msgs      # Decomp geometry messages
      - camera_fov           # Camera FOV geometry (header-only-ish)
      - plan_env             # Planning environment (grid map, raycast)
      - lkh_tsp_solver       # LKH TSP solver library
      - map_generator        # Random forest map generation
      - mockamap             # Mock map node
      - uav_simulator        # Metapackage (empty)
      - poscmd_2_odom        # Position command to odometry converter

  - name: "L1: Core Libraries & Search"
    description: "Path searching, trajectory optimization, and shared map interfaces"
    packages:
      - path_searching        # A* path searching (depends on plan_env)
      - map_interface         # Map interface layer (depends on plan_env, path_searching)
      - traj_opt              # Trajectory optimization (depends on plan_env, path_searching, traj_utils)
      - decomp_ros_utils      # Decomp ROS conversion utilities (depends on decomp_ros_msgs)
      - so3_control           # SO3 attitude control (depends on quadrotor_msgs)
      - so3_quadrotor_simulator # Quadrotor dynamics simulator (depends on quadrotor_msgs)
      - so3_quadrotor         # SO3 quadrotor nodelet (depends on quadrotor_msgs)
      - so3_controller        # SO3 controller nodelet (depends on quadrotor_msgs)
      - fake_traj_opt         # Fake trajectory optimization for simulation
      - target_ekf            # Target tracking EKF (depends on object_detection_msgs)
      - decomp_ros_utils      # Decomp utilities (depends on decomp_ros_msgs)

  - name: "L2: Perception & Mapping"
    description: "Scene understanding, semantic mapping, and local map builders"
    packages:
      - scene_graph           # Scene graph with AI perception (depends on map_interface, quadrotor_msgs)
      - mapping               # Target mapping nodelet (depends on quadrotor_msgs, object_detection_msgs)
      - fake_mapping          # Fake mapping for simulation (depends on quadrotor_msgs, object_detection_msgs)
      - local_sensing_node    # Local sensing with OpenGL/PCL rendering (depends on quadrotor_msgs)

  - name: "L3: Planning"
    description: "Trajectory and exploration planners"
    packages:
      - ego_planner           # EGO replanning FSM (depends on plan_env, path_searching, traj_opt, scene_graph, etc.)
      - exploration           # Autonomous exploration (depends on plan_env, map_interface, scene_graph, etc.)
      - planning              # Tracker planning (depends on mapping, traj_opt, decomp_ros_utils)
      - fake_planning         # Fake planning for simulation (depends on fake_mapping, fake_traj_opt, decomp_ros_utils)

  - name: "L4: Mission Control"
    description: "High-level mission executive orchestrating all subsystems"
    packages:
      - mission_executive     # Mission control (depends on scene_graph, exploration, ego_planner, traj_utils)
      - box_odom_estimator    # LiDAR target estimator with MoGe fallback (depends on scene_graph, quadrotor_msgs)

# ============================================================================
# BUILD ORDER (catkin build sequence, parallelizable groups)
# ============================================================================
build_order:
  - group: 0
    packages: [quadrotor_msgs, traj_utils, object_detection_msgs, decomp_ros_msgs,
               camera_fov, plan_env, lkh_tsp_solver, map_generator, mockamap,
               uav_simulator, poscmd_2_odom]
  - group: 1
    packages: [path_searching, map_interface, traj_opt, decomp_ros_utils,
               so3_control, so3_quadrotor_simulator, so3_quadrotor, so3_controller,
               fake_traj_opt, target_ekf]
  - group: 2
    packages: [scene_graph, mapping, fake_mapping, local_sensing_node]
  - group: 3
    packages: [ego_planner, exploration, planning, fake_planning]
  - group: 4
    packages: [mission_executive, box_odom_estimator]

# ============================================================================
# MISSING DEPENDENCIES (not found in workspace)
# ============================================================================
missing:
  ros:
    roscpp:           { install: apt install ros-${ROS_DISTRO}-roscpp }
    rospy:            { install: apt install ros-${ROS_DISTRO}-rospy }
    roslib:           { install: apt install ros-${ROS_DISTRO}-roslib }
    std_msgs:         { install: apt install ros-${ROS_DISTRO}-std-msgs }
    sensor_msgs:      { install: apt install ros-${ROS_DISTRO}-sensor-msgs }
    geometry_msgs:    { install: apt install ros-${ROS_DISTRO}-geometry-msgs }
    nav_msgs:         { install: apt install ros-${ROS_DISTRO}-nav-msgs }
    visualization_msgs: { install: apt install ros-${ROS_DISTRO}-visualization-msgs }
    cv_bridge:        { install: apt install ros-${ROS_DISTRO}-cv-bridge }
    tf:               { install: apt install ros-${ROS_DISTRO}-tf }
    message_generation: { install: apt install ros-${ROS_DISTRO}-message-generation }
    message_runtime:  { install: apt install ros-${ROS_DISTRO}-message-runtime }
    message_filters:  { install: apt install ros-${ROS_DISTRO}-message-filters }
    mavros:           { install: apt install ros-${ROS_DISTRO}-mavros }
    pcl_ros:          { install: apt install ros-${ROS_DISTRO}-pcl-ros }
    pcl_conversions:  { install: apt install ros-${ROS_DISTRO}-pcl-conversions }
    nodelet:          { install: apt install ros-${ROS_DISTRO}-nodelet }
    cmake_modules:    { install: apt install ros-${ROS_DISTRO}-cmake-modules }
    cmake_utils:      { install: apt install ros-${ROS_DISTRO}-cmake-utils }
    image_transport:  { install: apt install ros-${ROS_DISTRO}-image-transport }
    dynamic_reconfigure: { install: apt install ros-${ROS_DISTRO}-dynamic-reconfigure }
    eigen:            { install: apt install ros-${ROS_DISTRO}-eigen-conversions }
    svo_msgs:         { install: Source build required (SVO) }
    vikit_ros:        { install: Source build required (Vikit ROS) }

  system:
    libeigen3-dev:              { install: apt install libeigen3-dev }
    libopencv-dev:              { install: apt install libopencv-dev }
    libpcl-dev:                 { install: apt install libpcl-dev }
    libboost-all-dev:           { install: apt install libboost-all-dev }
    libglew-dev:                { install: apt install libglew-dev }
    libglfw3-dev:               { install: apt install libglfw3-dev }
    libgl1-mesa-dev:            { install: apt install libgl1-mesa-dev }
    libarmadillo-dev:           { install: apt install libarmadillo-dev }
    libomp-dev:                 { install: apt install libomp-dev }
    python3-numpy:              { install: apt install python3-numpy }
    pangolin:                   { install: apt install libpangolin-dev || build from source }

  third_party:
    igraph:                     { install: apt install libigraph-dev || build from source (v0.10+) }
    libleidenalg:               { install: Built from source at perception/scene_graph/libs/libleidenalg }
    nlohmann-json:              { install: Header-only, embedded in scene_graph/include/nlohmann/ }
    quickhull:                  { install: Header-only, embedded in scene_graph/libs/quickhull/ }

# ============================================================================
# DOCKER MAPPING (Dockerfile instructions)
# ============================================================================
docker_mapping:
  base_image: "ros:noetic-ros-base-focal"

  apt_prerequisites:
    - build-essential
    - cmake
    - git
    - python3-catkin-tools

  apt_ros_deps:
    - ros-noetic-roscpp
    - ros-noetic-rospy
    - ros-noetic-roslib
    - ros-noetic-std-msgs
    - ros-noetic-sensor-msgs
    - ros-noetic-geometry-msgs
    - ros-noetic-nav-msgs
    - ros-noetic-visualization-msgs
    - ros-noetic-cv-bridge
    - ros-noetic-tf
    - ros-noetic-message-generation
    - ros-noetic-message-runtime
    - ros-noetic-message-filters
    - ros-noetic-mavros
    - ros-noetic-mavros-extras
    - ros-noetic-pcl-ros
    - ros-noetic-pcl-conversions
    - ros-noetic-nodelet
    - ros-noetic-cmake-modules
    - ros-noetic-image-transport
    - ros-noetic-dynamic-reconfigure

  apt_system_deps:
    - libeigen3-dev
    - libopencv-dev
    - libpcl-dev
    - libboost-all-dev
    - libglew-dev
    - libglfw3-dev
    - libgl1-mesa-dev
    - libarmadillo-dev
    - libomp-dev
    - python3-numpy
    - libpangolin-dev

  source_builds:
    - name: igraph
      repo: https://github.com/igraph/igraph
      version: ">=0.10"
      cmake_flags: "-DCMAKE_BUILD_TYPE=Release"
    - name: libleidenalg
      path: perception/scene_graph/libs/libleidenalg
      cmake_flags: "-DCMAKE_BUILD_TYPE=Release"
    - name: SVO (svo_msgs, vikit_ros)
      repo: https://github.com/uzh-rpg/rpg_svo
      notes: "Required by local_sensing_node only; optional if not using local sensing"

  dockerfile_instructions:
    - "FROM ros:noetic-ros-base-focal AS deps"
    - "RUN apt-get update && apt-get install -y --no-install-recommends \\"
    - "    build-essential cmake git python3-catkin-tools \\"
    - "    # ROS packages \\"
    - "    ros-noetic-{roscpp,rospy,roslib,std-msgs,sensor-msgs,geometry-msgs} \\"
    - "    ros-noetic-{nav-msgs,visualization-msgs,cv-bridge,tf} \\"
    - "    ros-noetic-{message-generation,message-runtime,message-filters} \\"
    - "    ros-noetic-{mavros,mavros-extras,pcl-ros,pcl-conversions,nodelet} \\"
    - "    ros-noetic-{cmake-modules,image-transport,dynamic-reconfigure} \\"
    - "    # System libraries \\"
    - "    {libeigen3-dev,libopencv-dev,libpcl-dev,libboost-all-dev} \\"
    - "    {libglew-dev,libglfw3-dev,libgl1-mesa-dev,libarmadillo-dev} \\"
    - "    {libomp-dev,python3-numpy,libpangolin-dev} \\"
    - "    && rm -rf /var/lib/apt/lists/*"
    - ""
    - "# Build igraph from source"
    - "RUN git clone --depth 1 -b 0.10 https://github.com/igraph/igraph /tmp/igraph \\"
    - "    && cmake -S /tmp/igraph -B /tmp/igraph/build -DCMAKE_BUILD_TYPE=Release \\"
    - "    && cmake --build /tmp/igraph/build -j$(nproc) \\"
    - "    && cmake --install /tmp/igraph/build"
    - ""
    - "# Build libleidenalg if not pre-compiled"
    - "RUN mkdir -p /ws/src && ln -s /ws/src/perception/scene_graph/libs/libleidenalg /tmp/libleidenalg \\"
    - "    && cmake -S /tmp/libleidenalg -B /tmp/libleidenalg/build -DCMAKE_BUILD_TYPE=Release \\"
    - "    && cmake --build /tmp/libleidenalg/build -j$(nproc) \\"
    - "    && cmake --install /tmp/libleidenalg/build"

# ============================================================================
# DEPENDENCY GRAPH (DOT format)
# ============================================================================
dot_graph: |
  digraph deps {
    rankdir=LR;
    splines=ortho;
    node [shape=box, style=rounded];

    # Messages & Foundation L0
    quadrotor_msgs -> {std_msgs geometry_msgs nav_msgs sensor_msgs message_generation};
    traj_utils -> {roscpp std_msgs geometry_msgs message_generation};
    plan_env -> {roscpp rospy std_msgs cv_bridge message_filters Eigen3 OpenCV PCL};
    camera_fov -> {roscpp std_msgs Eigen3};

    # Core Libraries L1
    path_searching -> {plan_env Eigen3 PCL};
    map_interface -> {plan_env path_searching Eigen3 PCL};
    traj_opt -> {plan_env traj_utils path_searching Eigen3 PCL};
    decomp_ros_utils -> {decomp_ros_msgs Eigen3};

    # Perception L2
    scene_graph -> {map_interface quadrotor_msgs Eigen3 PCL libleidenalg igraph OpenMP};
    mapping -> {quadrotor_msgs object_detection_msgs Eigen3 pcl_ros};

    # Planning L3
    ego_planner -> {plan_env path_searching traj_opt traj_utils camera_fov scene_graph quadrotor_msgs};
    exploration -> {plan_env map_interface path_searching traj_utils lkh_tsp_solver camera_fov scene_graph quadrotor_msgs};
    planning -> {mapping traj_opt decomp_ros_utils quadrotor_msgs};

    # Mission L4
    mission_executive -> {scene_graph exploration traj_utils quadrotor_msgs ego_planner mavros OpenCV};
    box_odom_estimator -> {scene_graph quadrotor_msgs};
  }
